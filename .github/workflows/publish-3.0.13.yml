# Publish the authorised WooSwipe 3.0.13 release using the existing SVN deployment setup.
name: Publish WooSwipe 3.0.13

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-3.0.13.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish 3.0.13
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/3.0.13" >/dev/null 2>&1; then
            echo "Tag 3.0.13 already exists, retrying WordPress.org deployment"
          else
            git tag -a 3.0.13 -m "WooSwipe 3.0.13"
            git push origin 3.0.13
          fi

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          VERSION: 3.0.13
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
